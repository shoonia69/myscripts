[project]
name = "three-x-ui-portal"
version = "0.1.0"
description = "Self-service 3x-ui subscription portal"
requires-python = ">=3.11"
dependencies = [
  "aiogram==3.30.0",
  "cryptography==50.0.0",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "itsdangerous==2.2.0",
  "jinja2==3.1.6",
  "python-multipart==0.0.20",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
